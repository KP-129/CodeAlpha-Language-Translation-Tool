<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lingua - Language Translator</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div class="logo">
                <span class="logo-icon">🌐</span>
                <h1>Lingua</h1>
            </div>

            <p class="tagline">
                Break language barriers, one translation at a time.
            </p>
        </header>


        <!-- Translator -->
        <main class="translator-card">

            <!-- Language Selection -->
            <div class="language-bar">

                <div class="language-select">
                    <label for="source-language">From</label>

                    <select id="source-language">
                        <option value="auto">Auto Detect</option>
                        <option value="en">English</option>
                        <option value="te">Telugu</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>


                <!-- Swap Button -->
                <button class="swap-btn" id="swap-btn" title="Swap languages">
                    ⇄
                </button>


                <div class="language-select">
                    <label for="target-language">To</label>

                    <select id="target-language">
                        <option value="te">Telugu</option>
                        <option value="en">English</option>
                        <option value="hi">Hindi</option>
                        <option value="ta">Tamil</option>
                        <option value="kn">Kannada</option>
                        <option value="ml">Malayalam</option>
                        <option value="fr">French</option>
                        <option value="de">German</option>
                        <option value="es">Spanish</option>
                        <option value="it">Italian</option>
                        <option value="ja">Japanese</option>
                        <option value="ko">Korean</option>
                        <option value="zh-CN">Chinese</option>
                        <option value="ar">Arabic</option>
                    </select>
                </div>

            </div>


            <!-- Translation Areas -->
            <div class="translation-area">

                <!-- Input -->
                <div class="text-box">

                    <textarea
                        id="source-text"
                        maxlength="5000"
                        placeholder="Enter text to translate..."
                    ></textarea>

                    <div class="box-footer">
                        <span id="char-count">0 / 5000</span>

                        <button class="clear-btn" id="clear-btn">
                            Clear
                        </button>
                    </div>

                </div>


                <!-- Output -->
                <div class="text-box output-box">

                    <textarea
                        id="translated-text"
                        placeholder="Your translation will appear here..."
                        readonly
                    ></textarea>

                    <div class="box-footer">

                        <span></span>

                        <div class="output-actions">

                            <button
                                class="action-btn"
                                id="copy-btn"
                                title="Copy translation"
                            >
                                📋 Copy
                            </button>

                            <button
                                class="action-btn"
                                id="speak-btn"
                                title="Listen to translation"
                            >
                                🔊 Listen
                            </button>

                        </div>

                    </div>

                </div>

            </div>


            <!-- Translate Button -->
            <button class="translate-btn" id="translate-btn">
                Translate
            </button>

            <!-- Status -->
            <p id="status-message"></p>

        </main>


        <!-- Footer -->
        <footer>
            <p>Powered by Translation API • Lingua</p>
        </footer>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
